<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClassFlow｜課程日期計算器</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        sans-serif;

      background: #f5f6fa;
      color: #222;
    }

    header {
      background: white;
      padding: 28px 20px 22px;
      border-bottom: 1px solid #e8e8e8;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .label {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    input[type="date"],
    input[type="number"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .day {
      padding: 12px 5px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .day.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .option input {
      width: 20px;
      height: 20px;
    }

    .holiday-info {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #777;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    .add-row input {
      flex: 1;
    }

    .add-button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: 15px;
      white-space: nowrap;
    }

    .holiday-list {
      margin-top: 14px;
    }

    .holiday-item {
      display: flex;
      justify-content: space-between;
      align-items: center;

      background: #f5f6fa;

      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 8px;

      font-size: 14px;
    }

    .delete-button {
      border: none;
      background: transparent;
      font-size: 18px;
    }

    .calculate {
      width: 100%;
      padding: 16px;

      border: none;
      border-radius: 14px;

      background: #333;
      color: white;

      font-size: 17px;
      font-weight: 600;
    }

    .result {
      display: none;
    }

    .result-title {
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .result-date {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      margin: 10px 0;
    }

    .result-text {
      text-align: center;
      color: #777;
      margin-bottom: 18px;
    }

    .schedule-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .lesson {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      padding: 11px 0;

      border-bottom: 1px solid #eee;

      font-size: 14px;
    }

    .lesson.normal {
      color: #222;
    }

    .lesson.holiday {
      color: #c27a00;
      background: #fff9ed;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 8px;
      margin-bottom: 4px;
    }

    .lesson.custom {
      color: #a33;
      background: #fff3f3;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 8px;
      margin-bottom: 4px;
    }

    .empty {
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 10px;
    }

  </style>
</head>


<body>

<header>

  <div class="logo">
    📚 ClassFlow
  </div>

  <div class="subtitle">
    課程日期計算器
  </div>

</header>


<main>


  <!-- 開始日期 -->

  <div class="card">

    <div class="label">
      📅 課程開始日期
    </div>

    <input
      type="date"
      id="startDate"
    >

  </div>


  <!-- 上課星期 -->

  <div class="card">

    <div class="label">
      🗓️ 上課日
    </div>

    <div class="days">

      <button class="day" data-day="1">
        一
      </button>

      <button class="day" data-day="2">
        二
      </button>

      <button class="day" data-day="3">
        三
      </button>

      <button class="day" data-day="4">
        四
      </button>

      <button class="day" data-day="5">
        五
      </button>

      <button class="day" data-day="6">
        六
      </button>

      <button class="day" data-day="0">
        日
      </button>

    </div>

  </div>


  <!-- 堂數 -->

  <div class="card">

    <div class="label">
      🔢 課程堂數
    </div>

    <input
      type="number"
      id="lessonCount"
      min="1"
      value="16"
    >

  </div>


  <!-- 國定假日 -->

  <div class="card">

    <div class="label">
      🇹🇼 國定假日
    </div>


    <label class="option">

      <input
        type="checkbox"
        id="skipNationalHolidays"
        checked
      >

      自動跳過國定假日

    </label>


    <div class="holiday-info">

      系統目前內建
      <strong>2026、2027</strong>
      政府行政機關辦公日曆放假資料。

      <br>

      如果補習班有自己的停課日，
      可以在下方另外新增。

    </div>


    <div class="label">
      🚫 自訂停課日期
    </div>


    <div class="add-row">

      <input
        type="date"
        id="customHolidayDate"
      >

      <button
        class="add-button"
        onclick="addCustomHoliday()"
      >
        ＋ 新增
      </button>

    </div>


    <div
      class="holiday-list"
      id="customHolidayList"
    ></div>

  </div>


  <!-- 計算 -->

  <div class="card">

    <button
      class="calculate"
      onclick="calculateCourse()"
    >
      ✨ 開始計算
    </button>

  </div>


  <!-- 結果 -->

  <div
    class="card result"
    id="result"
  >

    <div class="result-title">
      🎯 預計最後一堂課
    </div>


    <div
      class="result-date"
      id="resultDate"
    >
      -
    </div>


    <div
      class="result-text"
      id="resultText"
    >
      -
    </div>


    <div class="schedule-title">
      📋 課程日期
    </div>


    <div id="schedule"></div>

  </div>


</main>


<script>


/* =========================
   上課星期
========================= */

const selectedDays = new Set();


document
  .querySelectorAll(".day")
  .forEach(button => {

    button.addEventListener("click", () => {

      const day =
        Number(button.dataset.day);


      if (selectedDays.has(day)) {

        selectedDays.delete(day);

        button.classList.remove("active");

      } else {

        selectedDays.add(day);

        button.classList.add("active");

      }

    });

  });



/* =========================
   台灣國定／政府機關放假日
========================= */

const nationalHolidays = {


  "2026": {

    "01-01": "中華民國開國紀念日",

    "02-14": "春節",
    "02-15": "春節",
    "02-16": "春節",
    "02-17": "春節",
    "02-18": "春節",
    "02-19": "春節",
    "02-20": "春節",
    "02-21": "春節",
    "02-22": "春節",

    "02-27": "和平紀念日連假",
    "02-28": "和平紀念日",
    "03-01": "和平紀念日補假",

    "04-03": "兒童節／清明節連假",
    "04-04": "兒童節",
    "04-05": "清明節",
    "04-06": "兒童節補假",

    "05-01": "勞動節",
    "05-02": "勞動節連假",
    "05-03": "勞動節連假",

    "06-19": "端午節",
    "06-20": "端午節連假",
    "06-21": "端午節連假",

    "09-25": "中秋節／教師節連假",
    "09-26": "中秋節／教師節連假",
    "09-27": "中秋節／教師節連假",
    "09-28": "教師節",

    "10-09": "國慶日連假",
    "10-10": "國慶日",
    "10-11": "國慶日補假",

    "10-24": "臺灣光復暨金門古寧頭大捷紀念日連假",
    "10-25": "臺灣光復暨金門古寧頭大捷紀念日",
    "10-26": "補假",

    "12-25": "行憲紀念日",
    "12-26": "行憲紀念日連假",
    "12-27": "行憲紀念日連假"

  },


  "2027": {

    "01-01": "中華民國開國紀念日",
    "01-02": "元旦連假",
    "01-03": "元旦連假",

    "02-04": "除夕／春節",
    "02-05": "春節",
    "02-06": "春節",
    "02-07": "春節",
    "02-08": "春節",
    "02-09": "春節補假",
    "02-10": "春節補假",

    "02-27": "和平紀念日連假",
    "02-28": "和平紀念日",
    "03-01": "和平紀念日補假",

    "04-03": "兒童節／清明節連假",
    "04-04": "兒童節",
    "04-05": "清明節",
    "04-06": "兒童節補假",

    "04-30": "勞動節補假",
    "05-01": "勞動節",
    "05-02": "勞動節連假",

    "06-09": "端午節",

    "09-15": "中秋節",

    "09-28": "教師節",

    "10-09": "國慶日連假",
    "10-10": "國慶日",
    "10-11": "國慶日補假",

    "10-23": "臺灣光復暨金門古寧頭大捷紀念日連假",
    "10-24": "臺灣光復暨金門古寧頭大捷紀念日",
    "10-25": "補假",

    "12-24": "行憲紀念日補假",
    "12-25": "行憲紀念日",
    "12-26": "行憲紀念日連假",

    "12-31": "2028元旦補假"

  }

};



/* =========================
   自訂停課日期
========================= */

const customHolidays = new Set();



function addCustomHoliday() {

  const input =
    document.getElementById(
      "customHolidayDate"
    );


  const date = input.value;


  if (!date) {

    alert("請先選擇停課日期！");

    return;

  }


  customHolidays.add(date);

  input.value = "";

  renderCustomHolidays();

}



function deleteCustomHoliday(date) {

  customHolidays.delete(date);

  renderCustomHolidays();

}



function renderCustomHolidays() {

  const list =
    document.getElementById(
      "customHolidayList"
    );


  list.innerHTML = "";


  const dates =
    [...customHolidays].sort();


  if (dates.length === 0) {

    list.innerHTML =
      '<div class="empty">目前沒有自訂停課日</div>';

    return;

  }


  dates.forEach(date => {

    const item =
      document.createElement("div");


    item.className =
      "holiday-item";


    item.innerHTML = `

      <span>
        🚫 ${date}
      </span>

      <button
        class="delete-button"
        onclick="deleteCustomHoliday('${date}')"
      >
        🗑️
      </button>

    `;


    list.appendChild(item);

  });

}



/* =========================
   日期工具
========================= */

function formatDate(date) {

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      date.getDate()
    ).padStart(2, "0");


  return `${year}/${month}/${day}`;

}



function getDateKey(date) {

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      date.getDate()
    ).padStart(2, "0");


  return `${year}-${month}-${day}`;

}



function getHolidayName(dateKey) {

  const parts =
    dateKey.split("-");


  const year =
    parts[0];


  const monthDay =
    `${parts[1]}-${parts[2]}`;


  if (
    nationalHolidays[year] &&
    nationalHolidays[year][monthDay]
  ) {

    return nationalHolidays[year][monthDay];

  }


  return null;

}



/* =========================
   計算課程
========================= */

function calculateCourse() {

  const startValue =
    document.getElementById(
      "startDate"
    ).value;


  const lessonCount =
    Number(
      document.getElementById(
        "lessonCount"
      ).value
    );


  const skipNational =
    document.getElementById(
      "skipNationalHolidays"
    ).checked;



  if (!startValue) {

    alert("請選擇課程開始日期！");

    return;

  }



  if (selectedDays.size === 0) {

    alert("請至少選擇一個上課日！");

    return;

  }



  if (
    !lessonCount ||
    lessonCount < 1
  ) {

    alert("請輸入正確的課程堂數！");

    return;

  }



  let currentDate =
    new Date(
      startValue + "T00:00:00"
    );


  let count = 0;


  const schedule = [];



  while (count < lessonCount) {

    const day =
      currentDate.getDay();


    const dateKey =
      getDateKey(currentDate);


    const isClassDay =
      selectedDays.has(day);


    const nationalHolidayName =
      getHolidayName(dateKey);


    const isNationalHoliday =
      Boolean(
        nationalHolidayName
      );


    const isCustomHoliday =
      customHolidays.has(dateKey);



    /*
      只有原本就是上課日
      才需要判斷是否停課
    */

    if (isClassDay) {


      /*
        國定假日
      */

      if (
        skipNational &&
        isNationalHoliday
      ) {

        schedule.push({

          date:
            formatDate(currentDate),

          status:
            `🇹🇼 ${nationalHolidayName}`,

          type:
            "holiday"

        });

      }


      /*
        自訂停課日
      */

      else if (isCustomHoliday) {

        schedule.push({

          date:
            formatDate(currentDate),

          status:
            "🚫 自訂停課日",

          type:
            "custom"

        });

      }


      /*
        正常上課
      */

      else {

        count++;


        schedule.push({

          date:
            formatDate(currentDate),

          status:
            `第 ${count} 堂`,

          type:
            "normal"

        });

      }

    }



    /*
      如果還沒完成指定堂數
      繼續往下一天
    */

    if (count < lessonCount) {

      currentDate.setDate(
        currentDate.getDate() + 1
      );

    }

  }



  /*
    顯示最後一堂
  */

  document.getElementById(
    "resultDate"
  ).textContent =
    formatDate(currentDate);



  document.getElementById(
    "resultText"
  ).textContent =
    `共計 ${lessonCount} 堂課`;



  /*
    顯示課程明細
  */

  const scheduleElement =
    document.getElementById(
      "schedule"
    );


  scheduleElement.innerHTML = "";



  schedule.forEach(item => {

    const row =
      document.createElement("div");


    row.className =
      `lesson ${item.type}`;


    row.innerHTML = `

      <span>
        ${item.status}
      </span>

      <span>
        ${item.date}
      </span>

    `;


    scheduleElement.appendChild(row);

  });



  document.getElementById(
    "result"
  ).style.display =
    "block";

}



/* =========================
   初始畫面
========================= */

renderCustomHolidays();


</script>

</body>
</html>
