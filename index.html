<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClassFlow 課程管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
               "Microsoft JhengHei", sans-serif;
  background: linear-gradient(135deg, #f5efff, #eee7ff);
  color: #333;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 25px 16px 50px;
}

h1 {
  text-align: center;
  color: #7656b8;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 25px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 6px 20px rgba(80, 50, 120, 0.08);
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 7px;
  color: #555;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 17px;
  background: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.weekdays {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.weekday {
  border: 1px solid #d7c9f5;
  background: #faf8ff;
  color: #7656b8;
  border-radius: 10px;
  padding: 9px 13px;
  cursor: pointer;
  font-size: 14px;
}

.weekday.active {
  background: #7656b8;
  color: white;
}

.holiday-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.holiday-row input {
  margin-bottom: 0;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 16px;
  cursor: pointer;
}

.add-btn {
  background: #eee8ff;
  color: #7656b8;
}

.calculate-btn {
  width: 100%;
  background: linear-gradient(135deg, #8061c8, #a184df);
  color: white;
  font-weight: 700;
  margin-top: 5px;
}

.save-btn {
  width: 100%;
  background: #4d9b73;
  color: white;
  font-weight: 700;
  margin-top: 12px;
}

.save-btn:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.result {
  display: none;
}

.result h2 {
  color: #7656b8;
  margin-top: 0;
}

.result-main {
  background: #f8f4ff;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}

.result-main strong {
  color: #7656b8;
  font-size: 20px;
}

.schedule {
  max-height: 350px;
  overflow-y: auto;
  background: #fafafa;
  border-radius: 12px;
  padding: 12px;
}

.schedule-item {
  padding: 8px 4px;
  border-bottom: 1px solid #eee;
}

.schedule-item:last-child {
  border-bottom: none;
}

.message {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  text-align: center;
}

.success {
  background: #e9f7ef;
  color: #27734d;
}

.error {
  background: #fff0f0;
  color: #b33a3a;
}

.small {
  color: #999;
  font-size: 13px;
  margin-top: -10px;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📚 ClassFlow</h1>
<div class="subtitle">課程日期計算 & Notion 管理</div>


<!-- =========================
     學生資料
========================= -->

<div class="card">

<label>👤 學生姓名</label>
<input id="studentName" type="text" placeholder="請輸入學生姓名">


<label>📌 期別</label>
<select id="period">
<option value="">請選擇期別</option>
<option value="第1期">第1期</option>
<option value="第2期">第2期</option>
<option value="第3期">第3期</option>
<option value="第4期">第4期</option>
<option value="第5期">第5期</option>
</select>


<label>🎓 年級</label>
<select id="grade">
<option value="">請選擇年級</option>
<option value="一年級">一年級</option>
<option value="二年級">二年級</option>
<option value="三年級">三年級</option>
<option value="四年級">四年級</option>
<option value="五年級">五年級</option>
<option value="六年級">六年級</option>
<option value="國一">國一</option>
<option value="國三">國三</option>
</select>


<label>📚 冊數</label>
<select id="book">
<option value="">請選擇冊數</option>
<option value="A1">A1</option>
<option value="A2">A2</option>
<option value="A3">A3</option>
<option value="B1">B1</option>
<option value="Book2">Book2</option>
<option value="Book3">Book3</option>
<option value="Book4">Book4</option>
<option value="Book5">Book5</option>
<option value="Book6">Book6</option>
<option value="Book7">Book7</option>
</select>


<label>👩‍🏫 老師</label>
<select id="teacher">
<option value="">請選擇老師</option>
<option value="政儒老師">政儒老師</option>
<option value="叮噹老師">叮噹老師</option>
<option value="卓杰老師">卓杰老師</option>
<option value="林沖老師">林沖老師</option>
<option value="Bonnie 老師">Bonnie 老師</option>
<option value="Sandy 老師">Sandy 老師</option>
<option value="Frank 老師">Frank 老師</option>
<option value="Ariel 老師">Ariel 老師</option>
<option value="Flora 老師">Flora 老師</option>
<option value="Amanda 老師">Amanda 老師</option>
</select>


<label>📝 備註</label>
<textarea id="note" placeholder="例如：教材已收到、特殊安排等"></textarea>

</div>


<!-- =========================
     課程設定
========================= -->

<div class="card">

<label>📅 開始日期</label>
<input id="startDate" type="date">


<label>📆 上課日</label>

<div class="weekdays">

<button class="weekday" data-day="1">星期一</button>
<button class="weekday" data-day="2">星期二</button>
<button class="weekday" data-day="3">星期三</button>
<button class="weekday" data-day="4">星期四</button>
<button class="weekday" data-day="5">星期五</button>
<button class="weekday" data-day="6">星期六</button>
<button class="weekday" data-day="0">星期日</button>

</div>


<label>
<input id="skipNational"
       type="checkbox"
       checked
       style="width:auto;">
🇹🇼 跳過國定假日
</label>


<label>➕ 自訂休假日</label>

<div class="holiday-row">

<input id="customHoliday"
       type="date">

<button class="add-btn"
        onclick="addHoliday()">
新增
</button>

</div>

<div id="holidayList"
     class="small">
</div>


<label>🔢 總堂數</label>

<input id="lessonCount"
       type="number"
       value="24"
       min="1">


<button class="calculate-btn"
        onclick="calculate()">
🧮 開始計算
</button>

</div>


<!-- =========================
     結果
========================= -->

<div class="card result"
     id="result">

<h2>📋 課程結果</h2>


<div class="result-main">

<div>
🏁 最後日期：
<strong id="finalDate"></strong>
</div>

<br>

<div>
🔢 總堂數：
<strong id="resultLessons"></strong>
</div>

<br>

<div>
⏭️ 跳過天數：
<strong id="skippedDays"></strong>
</div>

</div>


<h3>📆 完整上課日期</h3>

<div id="schedule"
     class="schedule">
</div>


<button class="save-btn"
        id="saveBtn"
        onclick="saveToNotion()">
☁️ 儲存到 Notion
</button>


<div id="message"
     class="message">
</div>

</div>

</div>

/* ==================================================
   自訂假日
================================================== */

let customHolidays = [];


/* ==================================================
   選擇上課日
================================================== */

let selectedDays = [];


document.querySelectorAll(".weekday")
.forEach(button => {

button.addEventListener("click", () => {

const day =
Number(button.dataset.day);


button.classList.toggle("active");


if (selectedDays.includes(day)) {

selectedDays =
selectedDays.filter(d => d !== day);

} else {

selectedDays.push(day);

}

});

});


/* ==================================================
   新增自訂假日
================================================== */

function addHoliday() {

const input =
document.getElementById("customHoliday");

const date =
input.value;


if (!date) {

alert("請先選擇日期");

return;

}


if (!customHolidays.includes(date)) {

customHolidays.push(date);

}


input.value = "";

renderHolidayList();

}


/* ==================================================
   顯示自訂假日
================================================== */

function renderHolidayList() {

const list =
document.getElementById("holidayList");


if (customHolidays.length === 0) {

list.innerHTML = "";

return;

}


list.innerHTML =
"自訂假日：" +
customHolidays.join("、");

}
