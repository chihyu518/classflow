<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClassFlow｜課程日期計算器</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  background: #f6f7fb;
  color: #333;
}

header {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 28px 20px;
  text-align: center;
}

.logo {
  font-size: 28px;
  font-weight: 700;
}

.subtitle {
  margin-top: 6px;
  font-size: 14px;
  opacity: 0.9;
}

main {
  max-width: 650px;
  margin: 0 auto;
  padding: 20px 15px 50px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

h2 {
  margin: 0 0 16px;
  font-size: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

input[type="date"],
input[type="number"] {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.day-btn {
  border: 1px solid #ddd;
  background: white;
  border-radius: 10px;
  padding: 11px 3px;
  font-size: 14px;
  cursor: pointer;
}

.day-btn.active {
  background: #667eea;
  color: white;
  border-color: #667eea;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 15px;
}

.checkbox-row input {
  width: 18px;
  height: 18px;
}

.add-row {
  display: flex;
  gap: 8px;
}

.add-row input {
  flex: 1;
}

.small-btn {
  border: none;
  background: #667eea;
  color: white;
  padding: 0 15px;
  border-radius: 10px;
  font-size: 14px;
}

.holiday-list {
  margin-top: 12px;
}

.holiday-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f7f7fb;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 7px;
  font-size: 14px;
}

.delete-btn {
  border: none;
  background: transparent;
  color: #e05252;
  font-size: 18px;
}

.calculate-btn {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.result {
  display: none;
}

.result.show {
  display: block;
}

.final-date {
  text-align: center;
  background: #f0efff;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 15px;
}

.final-date .title {
  font-size: 13px;
  color: #666;
}

.final-date .date {
  font-size: 27px;
  font-weight: 700;
  color: #667eea;
  margin-top: 5px;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

.summary-box {
  background: #f7f7fb;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
}

.summary-box .number {
  font-size: 22px;
  font-weight: 700;
}

.summary-box .text {
  font-size: 12px;
  color: #777;
}

.schedule {
  margin-top: 10px;
}

.schedule-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid #eee;
}

.schedule-date {
  min-width: 90px;
  font-weight: 600;
}

.schedule-status {
  font-size: 14px;
}

.schedule-item.normal .schedule-status {
  color: #555;
}

.schedule-item.holiday {
  color: #d47b00;
  background: #fffaf0;
}

.schedule-item.custom {
  color: #d9534f;
  background: #fff5f5;
}

.warning {
  color: #d9534f;
  background: #fff5f5;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
  display: none;
}

@media (max-width: 420px) {
  .weekdays {
    gap: 4px;
  }

  .day-btn {
    font-size: 13px;
    padding: 10px 2px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">📚 ClassFlow</div>
  <div class="subtitle">課程日期計算器</div>
</header>

<main>

  <!-- 開始日期 -->
  <div class="card">
    <h2>📅 課程開始日期</h2>

    <label for="startDate">開始上課日期</label>
    <input type="date" id="startDate">
  </div>

  <!-- 星期 -->
  <div class="card">
    <h2>📆 每週上課日</h2>

    <div class="weekdays">
      <button class="day-btn" data-day="1">一</button>
      <button class="day-btn" data-day="2">二</button>
      <button class="day-btn" data-day="3">三</button>
      <button class="day-btn" data-day="4">四</button>
      <button class="day-btn" data-day="5">五</button>
      <button class="day-btn" data-day="6">六</button>
      <button class="day-btn" data-day="0">日</button>
    </div>
  </div>

  <!-- 堂數 -->
  <div class="card">
    <h2>🔢 課程堂數</h2>

    <label for="lessonCount">總共上幾堂</label>
    <input
      type="number"
      id="lessonCount"
      min="1"
      value="16"
    >
  </div>

  <!-- 國定假日 -->
  <div class="card">

    <h2>🇹🇼 國定假日</h2>

    <div class="checkbox-row">
      <input type="checkbox" id="skipNational" checked>
      <label for="skipNational" style="margin:0;">
        自動跳過國定假日
      </label>
    </div>

    <div style="font-size:13px;color:#777;line-height:1.6;">
      依照政府行政機關辦公日曆自動跳過放假日。
    </div>

  </div>

  <!-- 自訂停課 -->
  <div class="card">

    <h2>🚫 自訂停課日期</h2>

    <div class="add-row">

      <input type="date" id="customDate">

      <button
        class="small-btn"
        id="addCustomBtn"
      >
        ＋ 新增
      </button>

    </div>

    <div id="customList" class="holiday-list"></div>

  </div>

  <!-- 開始計算 -->
  <div class="card">

    <div id="warning" class="warning"></div>

    <button
      class="calculate-btn"
      id="calculateBtn"
    >
      ✨ 開始計算
    </button>

  </div>

  <!-- 結果 -->
  <div class="card result" id="result">

    <h2>📋 課程結果</h2>

    <div class="final-date">

      <div class="title">
        最後一堂課
      </div>

      <div
        class="date"
        id="finalDate"
      >
      </div>

    </div>

    <div class="summary">

      <div class="summary-box">

        <div
          class="number"
          id="totalLessons"
        >
          0
        </div>

        <div class="text">
          上課堂數
        </div>

      </div>

      <div class="summary-box">

        <div
          class="number"
          id="skippedDays"
        >
          0
        </div>

        <div class="text">
          跳過日期
        </div>

      </div>

    </div>

    <h2 style="margin-top:20px;">
      📝 完整課表
    </h2>

    <div
      class="schedule"
      id="schedule"
    >
    </div>

  </div>

</main>

<script>

/* =========================
   選擇星期
========================= */

const selectedDays = new Set();

document.querySelectorAll(".day-btn").forEach(button => {

  button.addEventListener("click", () => {

    const day = Number(button.dataset.day);

    if (selectedDays.has(day)) {

      selectedDays.delete(day);
      button.classList.remove("active");

    } else {

      selectedDays.add(day);
      button.classList.add("active");

    }

  });

});


/* =========================
   2026 政府放假日期
   依 DGPA 官方辦公日曆
========================= */

const nationalHolidays = {

  "2026-01-01": "元旦",

  "2026-02-14": "春節",
  "2026-02-15": "春節",
  "2026-02-16": "春節",
  "2026-02-17": "春節",
  "2026-02-18": "春節",
  "2026-02-19": "春節",
  "2026-02-20": "春節補假",
  "2026-02-21": "春節",
  "2026-02-22": "春節",

  "2026-02-27": "和平紀念日補假",
  "2026-02-28": "和平紀念日",
  "2026-03-01": "和平紀念日連假",

  "2026-04-03": "兒童節補假",
  "2026-04-04": "兒童節",
  "2026-04-05": "清明節",
  "2026-04-06": "清明節補假",

  "2026-05-01": "勞動節",
  "2026-05-02": "勞動節連假",
  "2026-05-03": "勞動節連假",

  "2026-06-19": "端午節",
  "2026-06-20": "端午節連假",
  "2026-06-21": "端午節連假",

  "2026-09-25": "中秋節",
  "2026-09-26": "中秋節連假",
  "2026-09-27": "中秋節連假",
  "2026-09-28": "教師節",

  "2026-10-09": "國慶日補假",
  "2026-10-10": "國慶日",
  "2026-10-11": "國慶日連假",

  "2026-10-24": "光復暨古寧頭大捷紀念日連假",
  "2026-10-25": "光復暨古寧頭大捷紀念日",
  "2026-10-26": "光復暨古寧頭大捷紀念日補假",

  "2026-12-25": "行憲紀念日",
  "2026-12-26": "行憲紀念日連假",
  "2026-12-27": "行憲紀念日連假"
};


/* =========================
   自訂停課日期
========================= */

const customHolidays = new Set();


function renderCustomHolidays() {

  const list = document.getElementById("customList");

  list.innerHTML = "";

  if (customHolidays.size === 0) {
    return;
  }

  const dates = Array.from(customHolidays).sort();

  dates.forEach(date => {

    const item = document.createElement("div");

    item.className = "holiday-item";

    item.innerHTML = `
      <span>🚫 ${date}</span>
      <button
        class="delete-btn"
        onclick="removeCustomHoliday('${date}')"
      >
        ×
      </button>
    `;

    list.appendChild(item);

  });

}


function removeCustomHoliday(date) {

  customHolidays.delete(date);

  renderCustomHolidays();

}


document
  .getElementById("addCustomBtn")
  .addEventListener("click", () => {

    const input = document.getElementById("customDate");

    const date = input.value;

    if (!date) {
      return;
    }

    customHolidays.add(date);

    input.value = "";

    renderCustomHolidays();

  });


/* =========================
   日期格式
========================= */

function formatDate(date) {

  const y = date.getFullYear();

  const m = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const d = String(
    date.getDate()
  ).padStart(2, "0");

  return `${y}-${m}-${d}`;

}


function formatChineseDate(date) {

  const weekdays = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
  ];

  return `
    ${date.getFullYear()}/
    ${String(date.getMonth()+1).padStart(2,"0")}/
    ${String(date.getDate()).padStart(2,"0")}
    （${weekdays[date.getDay()]}）
  `;

}


/* =========================
   計算課程
========================= */

function calculateCourse() {

  const warning = document.getElementById("warning");

  warning.style.display = "none";

  const startValue =
    document.getElementById("startDate").value;

  const lessonCount =
    Number(
      document.getElementById("lessonCount").value
    );

  const skipNational =
    document.getElementById("skipNational").checked;


  /* 檢查 */

  if (!startValue) {

    warning.textContent =
      "請先選擇課程開始日期。";

    warning.style.display = "block";

    return;

  }


  if (selectedDays.size === 0) {

    warning.textContent =
      "請至少選擇一個上課日。";

    warning.style.display = "block";

    return;

  }


  if (!lessonCount || lessonCount < 1) {

    warning.textContent =
      "請輸入正確的課程堂數。";

    warning.style.display = "block";

    return;

  }


  /* 日期 */

  let currentDate =
    new Date(startValue + "T00:00:00");

  let count = 0;

  let skipped = 0;

  const schedule = [];


  /*
    防止設定錯誤導致無限迴圈
  */

  let safety = 0;


  while (
    count < lessonCount &&
    safety < 5000
  ) {

    safety++;

    const dateString =
      formatDate(currentDate);

    const weekDay =
      currentDate.getDay();

    const isClassDay =
      selectedDays.has(weekDay);

    const nationalHolidayName =
      nationalHolidays[dateString];

    const isNationalHoliday =
      Boolean(nationalHolidayName);

    const isCustomHoliday =
      customHolidays.has(dateString);


    if (isClassDay) {

      /* 國定假日 */

      if (
        skipNational &&
        isNationalHoliday
      ) {

        skipped++;

        schedule.push({

          date: formatChineseDate(currentDate),

          status:
            `🇹🇼 ${nationalHolidayName}`,

          type: "holiday"

        });

      }

      /* 自訂停課 */

      else if (isCustomHoliday) {

        skipped++;

        schedule.push({

          date: formatChineseDate(currentDate),

          status: "🚫 自訂停課",

          type: "custom"

        });

      }

      /* 正常上課 */

      else {

        count++;

        schedule.push({

          date: formatChineseDate(currentDate),

          status:
            `第 ${count} 堂`,

          type: "normal"

        });

      }

    }


    /* 下一天 */

    if (count < lessonCount) {

      currentDate.setDate(
        currentDate.getDate() + 1
      );

    }

  }


  /* =========================
     顯示結果
  ========================= */

  const result =
    document.getElementById("result");

  result.classList.add("show");


  document.getElementById("finalDate")
    .textContent =
      formatChineseDate(currentDate);


  document.getElementById("totalLessons")
    .textContent =
      lessonCount;


  document.getElementById("skippedDays")
    .textContent =
      skipped;


  const scheduleElement =
    document.getElementById("schedule");

  scheduleElement.innerHTML = "";


  schedule.forEach(item => {

    const row =
      document.createElement("div");

    row.className =
      `schedule-item ${item.type}`;

    row.innerHTML = `

      <div class="schedule-date">
        ${item.date}
      </div>

      <div class="schedule-status">
        ${item.status}
      </div>

    `;

    scheduleElement.appendChild(row);

  });


  /* 自動捲到結果 */

  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =========================
   計算按鈕
========================= */

document
  .getElementById("calculateBtn")
  .addEventListener(
    "click",
    calculateCourse
  );


/* =========================
   預設開始日期
========================= */

const today =
  new Date();

document.getElementById("startDate")
  .value =
    formatDate(today);


/* 初始載入 */

renderCustomHolidays();

</script>

</body>
</html>
