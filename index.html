<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassFlow｜課程日期計算器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: white;
      padding: 28px 20px 22px;
      border-bottom: 1px solid #e8e8e8;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .label {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    input[type="date"],
    input[type="number"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .day {
      padding: 12px 5px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .day.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    .holiday-option {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .holiday-option input {
      width: 20px;
      height: 20px;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    .add-row input {
      flex: 1;
    }

    .add-button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: 15px;
    }

    .holiday-list {
      margin-top: 14px;
    }

    .holiday-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f6fa;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    .delete-button {
      border: none;
      background: transparent;
      font-size: 18px;
    }

    .calculate {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #333;
      color: white;
      font-size: 17px;
      font-weight: 600;
    }

    .result {
      display: none;
    }

    .result-title {
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .result-date {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      margin: 10px 0;
    }

    .result-text {
      text-align: center;
      color: #777;
      margin-bottom: 18px;
    }

    .schedule-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .lesson {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .skipped {
      color: #999;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">📚 ClassFlow</div>
  <div class="subtitle">課程日期計算器</div>
</header>

<main>

  <div class="card">
    <div class="label">📅 課程開始日期</div>
    <input type="date" id="startDate">
  </div>

  <div class="card">
    <div class="label">🗓️ 上課日</div>

    <div class="days">
      <button class="day" data-day="1">一</button>
      <button class="day" data-day="2">二</button>
      <button class="day" data-day="3">三</button>
      <button class="day" data-day="4">四</button>
      <button class="day" data-day="5">五</button>
      <button class="day" data-day="6">六</button>
      <button class="day" data-day="0">日</button>
    </div>
  </div>

  <div class="card">
    <div class="label">🔢 課程堂數</div>
    <input type="number" id="lessonCount" min="1" value="16">
  </div>

  <div class="card">
    <div class="label">🚫 停課日期</div>

    <label class="holiday-option">
      <input type="checkbox" id="skipHolidays" checked>
      自動跳過設定的停課日期
    </label>

    <div class="add-row">
      <input type="date" id="holidayDate">
      <button class="add-button" onclick="addHoliday()">＋ 新增</button>
    </div>

    <div class="holiday-list" id="holidayList"></div>
  </div>

  <div class="card">
    <button class="calculate" onclick="calculateDate()">
      ✨ 開始計算
    </button>
  </div>

  <div class="card result" id="result">

    <div class="result-title">
      🎯 預計最後一堂課
    </div>

    <div class="result-date" id="resultDate">
      -
    </div>

    <div class="result-text" id="resultText">
      -
    </div>

    <div class="schedule-title">
      📋 課程日期
    </div>

    <div id="schedule"></div>

  </div>

</main>

<script>

  const selectedDays = new Set();
  const holidays = new Set();

  document.querySelectorAll(".day").forEach(button => {

    button.addEventListener("click", () => {

      const day = Number(button.dataset.day);

      if (selectedDays.has(day)) {

        selectedDays.delete(day);
        button.classList.remove("active");

      } else {

        selectedDays.add(day);
        button.classList.add("active");

      }

    });

  });

  function addHoliday() {

    const input = document.getElementById("holidayDate");
    const date = input.value;

    if (!date) {
      alert("請選擇停課日期！");
      return;
    }

    holidays.add(date);

    input.value = "";

    renderHolidays();
  }

  function deleteHoliday(date) {

    holidays.delete(date);

    renderHolidays();

  }

  function renderHolidays() {

    const list = document.getElementById("holidayList");

    list.innerHTML = "";

    const sorted = [...holidays].sort();

    sorted.forEach(date => {

      const item = document.createElement("div");

      item.className = "holiday-item";

      item.innerHTML = `
        <span>🚫 ${date}</span>
        <button class="delete-button"
          onclick="deleteHoliday('${date}')">🗑️</button>
      `;

      list.appendChild(item);

    });

  }

  function formatDate(date) {

    const year = date.getFullYear();

    const month = String(
      date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
      date.getDate()
    ).padStart(2, "0");

    return `${year}/${month}/${day}`;

  }

  function getDateKey(date) {

    const year = date.getFullYear();

    const month = String(
      date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
      date.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;

  }

  function calculateDate() {

    const startValue =
      document.getElementById("startDate").value;

    const lessonCount =
      Number(document.getElementById("lessonCount").value);

    const skipHolidays =
      document.getElementById("skipHolidays").checked;

    if (!startValue) {

      alert("請選擇課程開始日期！");
      return;

    }

    if (selectedDays.size === 0) {

      alert("請至少選擇一個上課日！");
      return;

    }

    if (!lessonCount || lessonCount < 1) {

      alert("請輸入正確的課程堂數！");
      return;

    }

    let currentDate =
      new Date(startValue + "T00:00:00");

    let count = 0;

    const schedule = [];

    while (count < lessonCount) {

      const day =
        currentDate.getDay();

      const dateKey =
        getDateKey(currentDate);

      const isClassDay =
        selectedDays.has(day);

      const isHoliday =
        holidays.has(dateKey);

      if (isClassDay) {

        if (skipHolidays && isHoliday) {

          schedule.push({
            date: formatDate(currentDate),
            status: "🚫 停課，不計堂"
          });

        } else {

          count++;

          schedule.push({
            date: formatDate(currentDate),
            status: `第 ${count} 堂`
          });

        }

      }

      if (count < lessonCount) {

        currentDate.setDate(
          currentDate.getDate() + 1
        );

      }

    }

    document.getElementById("resultDate").textContent =
      formatDate(currentDate);

    document.getElementById("resultText").textContent =
      `共計 ${lessonCount} 堂課`;

    const scheduleElement =
      document.getElementById("schedule");

    scheduleElement.innerHTML = "";

    schedule.forEach(item => {

      const row =
        document.createElement("div");

      row.className =
        item.status.includes("🚫")
          ? "lesson skipped"
          : "lesson";

      row.innerHTML = `
        <span>${item.status}</span>
        <span>${item.date}</span>
      `;

      scheduleElement.appendChild(row);

    });

    document.getElementById("result").style.display =
      "block";

  }

</script>

</body>
</html>
