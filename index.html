<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassFlow 課程日期計算器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
      color: #333;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 26px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .weekday {
      position: relative;
    }

    .weekday input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .weekday label {
      margin: 0;
      padding: 12px 5px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      background: #fff;
      font-weight: 500;
    }

    .weekday input:checked + label {
      background: #333;
      color: white;
      border-color: #333;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      margin-top: 20px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #calculateBtn {
      background: #333;
      color: white;
    }

    #saveBtn {
      background: #e8f3ff;
      color: #1769aa;
    }

    #result {
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: #f7f7f7;
      display: none;
    }

    #result h2 {
      margin-top: 0;
      font-size: 20px;
    }

    #schedule {
      line-height: 1.8;
      font-size: 15px;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .success {
      background: #e8f7ed;
      color: #237a3b;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    .hint {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📚 ClassFlow</h1>

  <label for="studentName">學生姓名</label>
  <input type="text" id="studentName" placeholder="請輸入學生姓名">

  <label for="period">📌 期別</label>
  <select id="period">
    <option value="第1期">第1期</option>
    <option value="第2期">第2期</option>
    <option value="第3期">第3期</option>
    <option value="第4期">第4期</option>
    <option value="第5期">第5期</option>
  </select>

  <label for="grade">🎓 年級</label>
  <select id="grade">
    <option value="">請選擇年級</option>
    <option value="一年級">一年級</option>
    <option value="二年級">二年級</option>
    <option value="三年級">三年級</option>
    <option value="四年級">四年級</option>
    <option value="五年級">五年級</option>
    <option value="六年級">六年級</option>
    <option value="國一">國一</option>
    <option value="國三">國三</option>
  </select>

  <label for="book">📚 冊數</label>
  <select id="book">
    <option value="">請選擇冊數</option>
    <option value="A1">A1</option>
    <option value="A2">A2</option>
    <option value="A3">A3</option>
    <option value="B1">B1</option>
    <option value="Book2">Book2</option>
    <option value="Book3">Book3</option>
    <option value="Book4">Book4</option>
    <option value="Book5">Book5</option>
    <option value="Book6">Book6</option>
    <option value="Book7">Book7</option>
  </select>

  <label for="teacher">👩‍🏫 老師</label>
  <select id="teacher">
    <option value="">請選擇老師</option>
    <option value="政儒老師">政儒老師</option>
    <option value="叮噹老師">叮噹老師</option>
    <option value="卓杰老師">卓杰老師</option>
    <option value="林沖老師">林沖老師</option>
    <option value="Bonnie 老師">Bonnie 老師</option>
    <option value="Sandy 老師">Sandy 老師</option>
    <option value="Frank 老師">Frank 老師</option>
    <option value="Ariel 老師">Ariel 老師</option>
    <option value="Flora 老師">Flora 老師</option>
    <option value="Amanda 老師">Amanda 老師</option>
  </select>

  <label>📆 上課日</label>

  <div class="weekdays">

    <div class="weekday">
      <input type="checkbox" id="mon" value="星期一">
      <label for="mon">星期一</label>
    </div>

    <div class="weekday">
      <input type="checkbox" id="tue" value="星期二">
      <label for="tue">星期二</label>
    </div>

    <div class="weekday">
      <input type="checkbox" id="wed" value="星期三">
      <label for="wed">星期三</label>
    </div>

    <div class="weekday">
      <input type="checkbox" id="thu" value="星期四">
      <label for="thu">星期四</label>
    </div>

    <div class="weekday">
      <input type="checkbox" id="fri" value="星期五">
      <label for="fri">星期五</label>
    </div>

    <div class="weekday">
      <input type="checkbox" id="sat" value="星期六">
      <label for="sat">星期六</label>
    </div>

  </div>

  <div class="hint">
    可複選，例如星期一＋星期三＋星期五
  </div>

  <label for="startDate">📅 開始日期</label>
  <input type="date" id="startDate">

  <label for="lessonCount">🔢 總堂數</label>
  <input type="number" id="lessonCount" value="24" min="1">

  <label for="customHolidays">🚫 自訂假日</label>
  <input
    type="text"
    id="customHolidays"
    placeholder="例如：2027-06-01, 2027-06-15"
  >
<label>💰 收費資料</label>

<div style="margin-top: 8px;">

  <label style="font-weight: 500; margin-top: 8px;">
    <input
      type="checkbox"
      id="feeBill"
      style="width: auto; margin-right: 8px;"
    >
    收費單
  </label>

  <label style="font-weight: 500; margin-top: 8px;">
    <input
      type="checkbox"
      id="textbook"
      style="width: auto; margin-right: 8px;"
    >
    教材
  </label>

</div>

<label for="textbookInfo">📚 教材冊數及金額</label>
<input
  type="text"
  id="textbookInfo"
  placeholder="例如：2冊／600元"
>
  <label for="note">📝 備註</label>
  <textarea
    id="note"
    placeholder="有需要可以輸入備註"
  ></textarea>

  <button id="calculateBtn">📅 計算課程日期</button>

  <div id="result">

    <h2>📋 課程結果</h2>

    <div>
      <strong>開始日期：</strong>
      <span id="resultStart"></span>
    </div>

    <div>
      <strong>最後日期：</strong>
      <span id="resultEnd"></span>
    </div>

    <div>
      <strong>總堂數：</strong>
      <span id="resultCount"></span>
    </div>

    <hr>

    <div id="schedule"></div>

    <button id="saveBtn">☁️ 儲存到 Notion</button>

    <div id="message" class="message"></div>

  </div>

</div>


<script>

// ==========================================
// Notion Web App
// ==========================================

const NOTION_API_URL =
  "https://script.google.com/macros/s/AKfycbwkdB9w58kiRpT0Hiz6p9o_mwIvwZlXjieWjOEnxnpHUNsmB0GRfP7JiGqJkIUCexdz/exec";


// ==========================================
// 2026 假日
// ==========================================

const holidays2026 = [

  "2026-01-01",

  "2026-02-14",
  "2026-02-15",
  "2026-02-16",
  "2026-02-17",
  "2026-02-18",
  "2026-02-19",
  "2026-02-20",
  "2026-02-21",
  "2026-02-22",

  "2026-02-27",
  "2026-02-28",

  "2026-04-03",
  "2026-04-04",
  "2026-04-05",
  "2026-04-06",

  "2026-05-01",

  "2026-06-19",

  "2026-09-25",
  "2026-09-28",

  "2026-10-09",
  "2026-10-10",

  "2026-10-25",
  "2026-10-26",

  "2026-12-25"
];


// ==========================================
// 2027 假日
// ==========================================

const holidays2027 = [

  "2027-01-01",
  "2027-01-02",
  "2027-01-03",

  "2027-02-04",
  "2027-02-05",
  "2027-02-06",
  "2027-02-07",
  "2027-02-08",
  "2027-02-09",
  "2027-02-10",

  "2027-02-27",
  "2027-02-28",
  "2027-03-01",

  "2027-04-03",
  "2027-04-04",
  "2027-04-05",
  "2027-04-06",

  "2027-04-30",
  "2027-05-01",
  "2027-05-02",

  "2027-10-09",
  "2027-10-10",
  "2027-10-11",

  "2027-10-23",
  "2027-10-24",
  "2027-10-25",

  "2027-12-24",
  "2027-12-25",
  "2027-12-26",

  "2027-12-31"
];


const holidays = new Set([
  ...holidays2026,
  ...holidays2027
]);


let calculatedData = null;


// ==========================================
// 日期格式
// ==========================================

function formatDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1).padStart(2, "0");

  const day =
    String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


// ==========================================
// 星期
// ==========================================

function getWeekdayName(date) {

  const names = [
    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"
  ];

  return names[date.getDay()];
}


// ==========================================
// 自訂假日
// ==========================================

function getCustomHolidays() {

  const text =
    document
      .getElementById("customHolidays")
      .value
      .trim();

  if (!text) {
    return new Set();
  }

  const dates =
    text
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);

  return new Set(dates);
}


// ==========================================
// 判斷假日
// ==========================================

function isHoliday(date, customHolidays) {

  const dateString =
    formatDate(date);

  return (
    holidays.has(dateString) ||
    customHolidays.has(dateString)
  );
}


// ==========================================
// 取得上課日
// ==========================================

function getSelectedWeekdays() {

  const checkboxes =
    document.querySelectorAll(
      '.weekday input[type="checkbox"]:checked'
    );

  return Array.from(checkboxes)
    .map(checkbox => checkbox.value);
}


// ==========================================
// 星期文字 → 數字
// ==========================================

function weekdayToNumber(name) {

  const map = {

    "星期日": 0,
    "星期一": 1,
    "星期二": 2,
    "星期三": 3,
    "星期四": 4,
    "星期五": 5,
    "星期六": 6

  };

  return map[name];
}


// ==========================================
// 顯示訊息
// ==========================================

function showMessage(text, type) {

  const message =
    document.getElementById("message");

  if (!text) {
    message.style.display = "none";
    message.textContent = "";
    return;
  }

  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}


// ==========================================
// 計算課程日期
// ==========================================

function calculateCourseDates() {

  const startDateValue =
    document.getElementById("startDate").value;

  const lessonCount =
    Number(
      document.getElementById("lessonCount").value
    );

  const weekdays =
    getSelectedWeekdays();

  const customHolidays =
    getCustomHolidays();


  // -------------------------
  // 檢查資料
  // -------------------------

  if (!startDateValue) {
    showMessage(
      "請先選擇開始日期",
      "error"
    );
    return;
  }

  if (!lessonCount || lessonCount < 1) {
    showMessage(
      "請輸入正確的總堂數",
      "error"
    );
    return;
  }

  if (weekdays.length === 0) {
    showMessage(
      "請至少選擇一個上課日",
      "error"
    );
    return;
  }


  // -------------------------
  // 建立開始日期
  // -------------------------

  const parts =
    startDateValue.split("-");

  let currentDate =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );


  // -------------------------
  // 計算日期
  // -------------------------

  const courseDates = [];

  const weekdayNumbers =
    weekdays.map(weekdayToNumber);

  let safetyCounter = 0;

  while (
    courseDates.length < lessonCount &&
    safetyCounter < 1100
  ) {

    const day =
      currentDate.getDay();

    if (
      weekdayNumbers.includes(day) &&
      !isHoliday(
        currentDate,
        customHolidays
      )
    ) {

      courseDates.push(
        formatDate(currentDate)
      );

    }

    currentDate.setDate(
      currentDate.getDate() + 1
    );

    safetyCounter++;
  }


  // -------------------------
  // 確認計算成功
  // -------------------------

  if (courseDates.length !== lessonCount) {

    showMessage(
      "課程日期計算失敗，請確認設定。",
      "error"
    );

    return;
  }


  // -------------------------
  // 儲存計算結果
  // -------------------------

  calculatedData = {

    studentName:
      document
        .getElementById("studentName")
        .value
        .trim(),

    period:
      document.getElementById("period").value,

    grade:
      document.getElementById("grade").value,

    book:
      document.getElementById("book").value,

    teacher:
      document.getElementById("teacher").value,

    startDate:
      courseDates[0],

    endDate:
      courseDates[courseDates.length - 1],

    lessonCount:
      lessonCount,

    weekdays:
      weekdays,

       // 收費單
    feeBill:
      document.getElementById("feeBill").checked,

    // 教材
    textbook:
      document.getElementById("textbook").checked,

    // 教材冊數及金額
    textbookInfo:
      document.getElementById("textbookInfo").value.trim(),

    // 備註
    note:
      document
        .getElementById("note")
        .value.trim(),

    courseDates:
      courseDates
  };


  // -------------------------
  // 顯示結果區
  // -------------------------

  document.getElementById("result").style.display =
    "block";

  document.getElementById("resultStart").textContent =
    courseDates[0];

  document.getElementById("resultEnd").textContent =
    courseDates[courseDates.length - 1];

  document.getElementById("resultCount").textContent =
    courseDates.length + " 堂";


  // -------------------------
  // 顯示每一堂課
  // -------------------------

  const schedule =
    document.getElementById("schedule");

  schedule.innerHTML = "";

  courseDates.forEach(function(date, index) {

    const dateParts =
      date.split("-");

    const dateObj =
      new Date(
        Number(dateParts[0]),
        Number(dateParts[1]) - 1,
        Number(dateParts[2])
      );

    const div =
      document.createElement("div");

    div.textContent =
      "第 " +
      (index + 1) +
      " 堂　" +
      date +
      "　" +
      getWeekdayName(dateObj);

    schedule.appendChild(div);

  });


  showMessage("", "");
}


// ==========================================
// 計算按鈕
// ==========================================

document
  .getElementById("calculateBtn")
  .addEventListener(
    "click",
    calculateCourseDates
  );
console.log("ClassFlow JS 已成功啟動");

// ==========================================
// 儲存到 Notion
// ==========================================

document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    async function() {

      if (!calculatedData) {

        showMessage(
          "請先按「📅 計算課程日期」",
          "error"
        );

        return;
      }


      const saveBtn =
        document.getElementById("saveBtn");

      saveBtn.disabled = true;
      saveBtn.textContent =
        "⏳ 儲存中...";


      try {

        await fetch(
          NOTION_API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(calculatedData),

            mode: "no-cors"
          }
        );


        showMessage(
          "✅ 已送出儲存請求，請到 Notion 查看資料。",
          "success"
        );


      } catch (error) {

        console.error(error);

        showMessage(
          "❌ 儲存失敗：" +
          error.message,
          "error"
        );

      } finally {

        saveBtn.disabled = false;

        saveBtn.textContent =
          "☁️ 儲存到 Notion";

      }

    }
  );

</script>

</body>
</html>
